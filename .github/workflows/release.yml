name: Build and Release

# Trigger by pushing a version tag, e.g.:
#   git tag v1.3.0
#   git push origin v1.3.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          echo "FFMPEG_PATH=$($ffmpegExe.FullName)" >> $env:GITHUB_ENV

      # Video_Downloader.spec (underscore) is the one with FFmpeg bundling
      # set up correctly - same file build_exe.bat uses locally. It reads
      # the FFMPEG_PATH env var we just set, falling back to Steve's local
      # WinGet path only when that variable is unset.
      - name: Build executable with PyInstaller
        run: pyinstaller --noconfirm "Video_Downloader.spec"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/VideoDownloader-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
